<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CloudDevis</title>
  <style>
    body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0B3D2E; font-family: system-ui; }
    .loader { text-align: center; color: #F5F1E8; }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(245,237,214,0.2); border-top-color: #C4A35A; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <div>CloudDevis</div>
  </div>
</body>
</html>

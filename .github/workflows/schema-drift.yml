name: Schema Drift Check

on:
  push:
    branches: [main]
    paths:
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
  pull_request:
    paths:
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'

jobs:
  drift-check:
    name: Detect schema/migration drift
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for unapplied migrations
        # Fails if schema.prisma has changes not covered by a migration file.
        # prisma migrate diff exits with code 2 when there is a diff, 0 when clean.
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code \
          && echo "✅ Schema and migrations are in sync." \
          || (echo "❌ DRIFT DETECTED: schema.prisma has changes not in a migration. Run: npx prisma migrate dev --name <your_change>" && exit 1)
